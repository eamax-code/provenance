[project]
name = "provenance-client"
version = "0.1.0"
description = "Python client for the Provenance API: SEC filings, point-in-time facts, listings and the live event feed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Provenance" }]
keywords = ["sec", "edgar", "xbrl", "financial data", "filings", "api", "point-in-time"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/eamax-code/provenance"
Documentation = "https://github.com/eamax-code/provenance/tree/main/clients/python"
Changelog = "https://github.com/eamax-code/provenance/blob/main/clients/python/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_client"]
