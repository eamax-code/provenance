[project]
name = "provenance-client"
version = "0.1.0"
description = "Python client for the Provenance API: SEC filings, point-in-time facts, listings and the live event feed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_client"]
