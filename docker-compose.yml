# Local development only. Do not use these credentials anywhere else.
services:
  db:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 with pgvector (vector search, issue #2)
    shm_size: 1gb  # parallel queries, vacuum and HNSW builds need more than Docker's 64 MB
    environment:
      POSTGRES_USER: companydata
      POSTGRES_PASSWORD: companydata
      POSTGRES_DB: companydata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companydata"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://companydata:companydata@db:5432/companydata
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://companydata:companydata@db:5432/companydata
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - seccache:/app/.sec_cache

  poller:
    build: .
    # Also runs the daily international-listings job (MARKETS_DAILY_ENABLED, default true), the
    # daily retention purge and operator alerts (ALERT_WEBHOOK_URL in .env).
    command: ["python", "scripts/poll_sec.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://companydata:companydata@db:5432/companydata
      MARKETS_CACHE_DIR: /app/.markets_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - seccache:/app/.sec_cache
      - marketscache:/app/.markets_cache

  current8k:
    build: .
    # Officer changes from new 8-K item 5.02 filings within minutes (ticket 20).
    command: ["python", "scripts/poll_current_8k.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://companydata:companydata@db:5432/companydata
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  seccache:
  marketscache:
