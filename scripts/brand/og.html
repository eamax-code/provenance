<!doctype html>
<!-- The link-preview image (site/img/og.png, 1200×630), brand: Trace. One highlight only, on the figure, with its leader to the filing. Render with scripts/brand/render_og.sh.
     The figure is real: Apple's fiscal 2026 revenue as the API returns it, cited to its 10-K. -->
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 400 800; src: url('../../site/fonts/schibsted-grotesk-latin-var.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('../../site/fonts/ibm-plex-mono-latin-500.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #141719; color: #e7ebee; font-family: 'Schibsted Grotesk', Arial, sans-serif; overflow: hidden; }

  .fig { position: absolute; left: 72px; bottom: 64px; display: flex; align-items: flex-start; gap: 0; }

  <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M14,10H94L84,58H4ZM30,18H55A16,16 0 0 1 55,50H42V58H30ZM42,27H54A7,7 0 0 1 54,41H42Z"/><path fill="currentColor" d="M30,57H42V78H64V90H30ZM65,84a11,11 0 1 0 22,0a11,11 0 1 0 -22,0Z"/></svg>provenance</div>
