name: Publish the Python client

# Push a tag like client-v0.1.0 to publish clients/python to PyPI. Uses PyPI trusted publishing:
# on pypi.org, add this repository and workflow as a trusted publisher for provenance-client
# (no token is stored here).
on:
  push:
    tags: ["client-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the client version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('clients/python/pyproject.toml','rb'))['project']['version'])")
          test "client-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != client-v$v"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build clients/python --outdir dist
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
