# Render blueprint alternative: web service + background worker + managed Postgres.
services:
  - type: web
    name: provenance-api
    runtime: docker
    plan: starter
    healthCheckPath: /readyz
    preDeployCommand: alembic upgrade head
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: provenance-db, property: connectionString }
      - key: SEC_USER_AGENT
        sync: false
      - key: API_KEY_PEPPER
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
  # Daily international-listings job as a native cron (so the worker does not also run it).
  - type: cron
    name: provenance-markets-daily
    runtime: docker
    plan: starter
    schedule: "45 9 * * *"          # 09:45 UTC, after ESMA/FCA publish their deltas
    dockerCommand: python scripts/ingest_markets.py --all
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: provenance-db, property: connectionString }
      - key: SEC_USER_AGENT
        sync: false
      - key: API_KEY_PEPPER
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: MARKETS_SOURCES_ENABLED
        value: esma_firds,fca_firds,gleif
  - type: worker
    name: provenance-poller
    runtime: docker
    plan: starter
    dockerCommand: python scripts/poll_sec.py
    envVars:
      - key: APP_ENV
        value: production
      - key: MARKETS_DAILY_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase: { name: provenance-db, property: connectionString }
      - key: SEC_USER_AGENT
        sync: false
      - key: API_KEY_PEPPER
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
databases:
  - name: provenance-db
    plan: basic-256mb
